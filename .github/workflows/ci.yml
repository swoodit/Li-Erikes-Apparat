name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture canonical formatter output temporarily
        run: |
          pnpm exec prettier --write packages/contracts/src/service-workflow.ts packages/contracts/test/service-workflow.test.ts packages/domain/src/part-offers.ts packages/domain/src/service-workflow.ts packages/domain/test/service-workflow.test.ts
          node --input-type=commonjs -e 'const fs = require("node:fs");
          const file = fs.readFileSync("packages/contracts/src/service-workflow.ts");
          process.stdout.write("FORMATFILE:packages/contracts/src/service-workflow.ts:");
          process.stdout.write(file.toString("base64") + "\n");
          const file = fs.readFileSync("packages/contracts/test/service-workflow.test.ts");
          process.stdout.write("FORMATFILE:packages/contracts/test/service-workflow.test.ts:");
          process.stdout.write(file.toString("base64") + "\n");
          const file = fs.readFileSync("packages/domain/src/part-offers.ts");
          process.stdout.write("FORMATFILE:packages/domain/src/part-offers.ts:");
          process.stdout.write(file.toString("base64") + "\n");
          const file = fs.readFileSync("packages/domain/src/service-workflow.ts");
          process.stdout.write("FORMATFILE:packages/domain/src/service-workflow.ts:");
          process.stdout.write(file.toString("base64") + "\n");
          const file = fs.readFileSync("packages/domain/test/service-workflow.test.ts");
          process.stdout.write("FORMATFILE:packages/domain/test/service-workflow.test.ts:");
          process.stdout.write(file.toString("base64") + "\n");
          '
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
